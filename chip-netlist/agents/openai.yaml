interface:
  display_name: "Chip Netlist Reverse Engineering"
  short_description: "Extract AI-ready .epro2 connectivity, create context packets, find data sheets, and infer chip settings"
  default_prompt: "Use $chip-netlist to extract or read AI-ready connectivity. For large projects, create a .chip-netlist workbench and load only the current context packet before finding relevant data sheets online and inferring chip configuration or circuit issues."
policy:
  allow_implicit_invocation: true
